packages:
  - "apps/pwa"
  - "apps/merchant"
  - "apps/business"
  - "apps/landing"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# These libraries import React in their type declarations but do not declare
# @types/react as a peer. With two React majors in this workspace (the PWA on
# 19, the merchant app on 18) their types fell through to whichever copy pnpm
# hoisted into the shared store -- 18 -- and disagreed with the PWA's 19 about
# ReactNode. Declaring the peer makes pnpm link each library to the types of
# the app that imports it, so the merchant app keeps 18 and the PWA gets 19.
packageExtensions:
  next:
    peerDependencies:
      '@types/react': '*'
  next-themes:
    peerDependencies:
      '@types/react': '*'
  framer-motion:
    peerDependencies:
      '@types/react': '*'
  '@tanstack/react-query':
    peerDependencies:
      '@types/react': '*'
  react-icons:
    peerDependencies:
      '@types/react': '*'
  react-qrcode-logo:
    peerDependencies:
      '@types/react': '*'
